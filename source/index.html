<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>循人课表</title>
  <style>
    :root {
      --bg: #f3f5f2;
      --surface: #ffffff;
      --surface-2: #e9ede8;
      --ink: #17221d;
      --ink-2: #4c5a53;
      --ink-3: #7d8a83;
      --line: #d5dcd6;
      --accent: #1f5c47;
      --accent-ink: #ffffff;
      --accent-soft: #dcebe4;
      --focus: #2f7d62;
      --cs: 62%;
      /* 科目色 饱和度 */
      --cl: 92%;
      /* 科目色 亮度（底） */
      --cf: 28%;
      /* 科目色 亮度（字） */
      --shadow: 0 1px 2px rgba(23, 34, 29, .06), 0 4px 14px rgba(23, 34, 29, .05);
      --r: 10px;
      --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
      --mono: "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111714;
        --surface: #18201c;
        --surface-2: #222c27;
        --ink: #e6ede9;
        --ink-2: #a9b7b0;
        --ink-3: #74837b;
        --line: #2d3832;
        --accent: #6cc3a0;
        --accent-ink: #0d1612;
        --accent-soft: #1e3a2f;
        --focus: #8ad6b6;
        --cs: 32%;
        --cl: 21%;
        --cf: 84%;
        --shadow: none;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #111714;
      --surface: #18201c;
      --surface-2: #222c27;
      --ink: #e6ede9;
      --ink-2: #a9b7b0;
      --ink-3: #74837b;
      --line: #2d3832;
      --accent: #6cc3a0;
      --accent-ink: #0d1612;
      --accent-soft: #1e3a2f;
      --focus: #8ad6b6;
      --cs: 32%;
      --cl: 21%;
      --cf: 84%;
      --shadow: none;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .num {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 顶栏 ---------- */
    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .top-in {
      max-width: 1320px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 20px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-right: auto;
    }

    .brand b {
      font-size: 17px;
      letter-spacing: .04em;
    }

    .brand span {
      color: var(--ink-3);
      font-size: 12px;
    }

    .seg {
      display: inline-flex;
      background: var(--surface-2);
      border-radius: 999px;
      padding: 3px;
    }

    .seg button {
      border: 0;
      background: none;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .seg button.on {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .search {
      position: relative;
    }

    .search input {
      width: 220px;
      max-width: 60vw;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 14px 7px 32px;
      font: inherit;
    }

    .search svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
    }

    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    /* ---------- 列表页 ---------- */
    .pagehead {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .pagehead h1 {
      font-size: 24px;
      margin: 0;
      text-wrap: balance;
    }

    .pagehead p {
      margin: 2px 0 0;
      color: var(--ink-2);
    }

    .section {
      margin-top: 26px;
    }

    .section h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--ink-2);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section h2 .count {
      font-weight: 400;
      color: var(--ink-3);
      letter-spacing: 0;
    }

    .section h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .tgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 10px;
    }

    .tcard {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 6px 10px;
      align-items: end;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }

    .tcard:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .tcard .nm {
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .tcard .sj {
      grid-column: 1;
      font-size: 12px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tcard .tot {
      grid-row: 1 / 3;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .tcard .tot b {
      font-size: 20px;
      line-height: 1;
    }

    .tcard .tot small {
      font-size: 10px;
      color: var(--ink-3);
    }

    .spark {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 18px;
    }

    .spark i {
      width: 5px;
      border-radius: 1px;
      background: var(--accent);
      opacity: .75;
      min-height: 2px;
    }

    .cgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 10px;
    }

    .ccard {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }

    .ccard:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .ccard b {
      display: block;
      font-size: 18px;
    }

    .ccard span {
      font-size: 12px;
      color: var(--ink-3);
    }

    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--ink-3);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .btn.primary:hover {
      color: var(--accent-ink);
      filter: brightness(1.08);
    }

    /* ---------- 详情页 ---------- */
    .dnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .dnav .sp {
      flex: 1;
    }

    .dhead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px 28px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
    }

    .dhead .kind {
      font-size: 12px;
      letter-spacing: .1em;
      color: var(--ink-3);
    }

    .dhead h1 {
      margin: 2px 0 8px;
      font-size: 32px;
      line-height: 1.15;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 999px;
      background: hsl(var(--h, 150) var(--cs) var(--cl));
      color: hsl(var(--h, 150) 45% var(--cf));
    }

    .chip.plain {
      background: var(--surface-2);
      color: var(--ink-2);
    }

    .week {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }

    .week .d {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 38px;
    }

    .week .bar {
      width: 100%;
      background: var(--surface-2);
      border-radius: 6px;
      height: 56px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .week .bar i {
      display: block;
      width: 100%;
      background: var(--accent);
      border-radius: 6px 6px 0 0;
    }

    .week .d b {
      font-size: 14px;
    }

    .week .d span {
      font-size: 11px;
      color: var(--ink-3);
    }

    .week .total {
      margin-left: 12px;
      padding-left: 16px;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .week .total b {
      font-size: 40px;
      line-height: 1;
      color: var(--accent);
    }

    .week .total span {
      font-size: 12px;
      color: var(--ink-3);
    }

    .meta {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
      color: var(--ink-2);
      font-size: 13px;
    }

    .meta b {
      color: var(--ink);
      font-weight: 600;
    }

    /* 课表格 */
    .ttwrap {
      margin-top: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow-x: auto;
    }

    .tt {
      border-collapse: separate;
      border-spacing: 4px;
      width: 100%;
      min-width: 1060px;
      table-layout: fixed;
      padding: 6px;
    }

    .tt th {
      font-weight: 500;
      color: var(--ink-3);
      font-size: 11px;
      padding: 4px 2px 6px;
      vertical-align: bottom;
    }

    .tt th .p {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .tt th.day {
      width: 64px;
      text-align: left;
      padding-left: 6px;
      vertical-align: middle;
    }

    .tt th.day b {
      display: block;
      font-size: 15px;
      color: var(--ink);
    }

    .tt th.gap,
    .tt td.gap {
      width: 10px;
      padding: 0;
    }

    .tt td.gap {
      background: repeating-linear-gradient(180deg, var(--line) 0 3px, transparent 3px 7px);
      background-size: 1px 100%;
      background-repeat: no-repeat;
      background-position: center;
    }

    .tt th.cnt {
      width: 48px;
    }

    .tt td {
      height: 62px;
      border-radius: 8px;
      padding: 6px 7px;
      vertical-align: top;
      font-size: 12px;
      line-height: 1.3;
    }

    .tt td.slot {
      background: var(--bg);
    }

    .tt td.on {
      background: hsl(var(--h) var(--cs) var(--cl));
      color: hsl(var(--h) 45% var(--cf));
    }

    .tt td.on .s {
      font-weight: 700;
      font-size: 13px;
      display: block;
    }

    .tt td.on .w {
      display: block;
      margin-top: 2px;
      opacity: .85;
      overflow-wrap: anywhere;
    }

    .tt td.on.act {
      background: var(--surface-2);
      color: var(--ink-2);
    }

    .tt td.on.act .s {
      font-weight: 500;
    }

    .tt td.count {
      text-align: center;
      vertical-align: middle;
      font-size: 18px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tt tr.sat th.day b,
    .tt tr.sat th.day span {
      color: var(--ink-3);
    }

    .note {
      margin: 10px 4px 0;
      color: var(--ink-3);
      font-size: 12px;
    }

    /* 手机：按天列表 */
    .days {
      display: none;
      margin-top: 16px;
      gap: 12px;
    }

    .dayc {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .dayc h3 {
      margin: 0 0 8px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
    }

    .dayc h3 span {
      color: var(--ink-3);
      font-weight: 400;
      font-size: 12px;
    }

    .dayc ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .dayc li {
      display: grid;
      grid-template-columns: 30px 88px 1fr;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      background: hsl(var(--h) var(--cs) var(--cl));
      color: hsl(var(--h) 45% var(--cf));
    }

    .dayc li.act {
      background: var(--surface-2);
      color: var(--ink-2);
    }

    .dayc li .p {
      font-weight: 700;
    }

    .dayc li .t {
      font-size: 11px;
      opacity: .8;
    }

    .dayc li .w {
      overflow-wrap: anywhere;
    }

    .dayc .none {
      color: var(--ink-3);
      font-size: 13px;
    }

    /* 科目统计表 */
    .plan {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }

    .prow {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .prow .who {
      overflow-wrap: anywhere;
    }

    .prow .who small {
      display: block;
      color: var(--ink-3);
      font-size: 11px;
    }

    .prow b {
      font-size: 16px;
    }

    .prow b small {
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-3);
      margin-left: 2px;
    }

    a.lnk,
    button.lnk {
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
      text-align: left;
    }

    a.lnk:hover,
    button.lnk:hover {
      text-decoration-color: var(--accent);
      color: var(--accent);
    }

    /* ---------- 总表 ---------- */
    .sumwrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow-x: auto;
    }

    table.sum {
      border-collapse: collapse;
      width: 100%;
      min-width: 820px;
    }

    table.sum th {
      position: sticky;
      top: 0;
      background: var(--surface);
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--ink-2);
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    table.sum th.c,
    table.sum td.c {
      text-align: center;
    }

    table.sum th[aria-sort]::after {
      content: " ↓";
      color: var(--accent);
    }

    table.sum th[aria-sort="ascending"]::after {
      content: " ↑";
    }

    table.sum td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    table.sum tr:hover td {
      background: var(--bg);
    }

    table.sum td.h {
      width: 44px;
    }

    table.sum td.h span {
      display: inline-block;
      min-width: 30px;
      padding: 2px 0;
      border-radius: 6px;
      background: color-mix(in srgb, var(--accent) calc(var(--v) * 8%), transparent);
    }

    table.sum td.h span.hi {
      color: var(--accent-ink);
    }

    table.sum td.tot {
      width: 170px;
    }

    .tbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tbar i {
      height: 8px;
      border-radius: 4px;
      background: var(--accent);
      display: block;
    }

    .tbar b {
      min-width: 24px;
    }

    table.sum td.sj {
      color: var(--ink-2);
      font-size: 12px;
    }

    table.sum td.cl {
      color: var(--ink-3);
      font-size: 12px;
      max-width: 420px;
    }

    table.sum tr.grp td {
      background: var(--bg);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      letter-spacing: .06em;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
    }

    .stat b {
      font-size: 20px;
      display: block;
      line-height: 1.2;
    }

    .stat span {
      font-size: 12px;
      color: var(--ink-3);
    }

    /* 科目色相 */
    .k-cn {
      --h: 356
    }

    .k-en {
      --h: 214
    }

    .k-bm {
      --h: 38
    }

    .k-ma {
      --h: 268
    }

    .k-sc {
      --h: 142
    }

    .k-hi {
      --h: 22
    }

    .k-bz {
      --h: 178
    }

    .k-ict {
      --h: 196
    }

    .k-art {
      --h: 322
    }

    .k-pe {
      --h: 88
    }

    .k-gd {
      --h: 240
    }

    .k-prj {
      --h: 250
    }

    .k-oth {
      --h: 150
    }


    /* ---------- 读取状态 ---------- */
    .load {
      max-width: 560px;
      margin: 8vh auto 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }

    .load h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .load p {
      color: var(--ink-2);
      margin: 0 0 16px;
    }

    .load .err {
      color: #b3261e;
      background: color-mix(in srgb, #b3261e 10%, transparent);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      text-align: left;
    }

    .drop {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 26px 16px;
      cursor: pointer;
      display: block;
      transition: border-color .15s, background .15s;
    }

    .drop:hover,
    .drop.over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .drop input {
      display: none;
    }

    .drop b {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .drop span {
      font-size: 12px;
      color: var(--ink-3);
    }

    .spin {
      width: 28px;
      height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 6px auto 14px;
      animation: sp 1s linear infinite;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg);
      }
    }


    /* ---------- 页脚 ---------- */
    .foot {
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .foot-in {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-items: center;
      justify-content: space-between;
      color: var(--ink-3);
      font-size: 12px;
    }

    .foot-in b {
      color: var(--ink-2);
      font-weight: 600;
    }

    .foot a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-2);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      transition: border-color .15s, color .15s;
    }

    .foot a:hover {

            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />

  <script>
    /* ===== 页脚设置：把 GitHub 项目网址填在这里 ===== */
    const GITHUB_URL = 'https://github.com/你的用户名/TJHS-School-Teacher-TimeTable';
  </script>
  <script>
    /* =====================================================================
   读取「班级课表.html」并解析（每次打开页面都重新读取）
   ===================================================================== */
    function decodeHtml(buf) {
      const u8 = new Uint8Array(buf);
      const probe = new TextDecoder('latin1').decode(u8.slice(0, 4096));
      const m = probe.match(/charset\s*=\s*["']?([\w-]+)/i);
      let cs = (m ? m[1] : 'utf-8').toLowerCase();
      if (cs === 'gb2312' || cs === 'gbk') cs = 'gb18030';
      try {
        return new TextDecoder(cs).decode(u8);
      } catch (e) {
        return new TextDecoder('utf-8').decode(u8);
      }
    }
    const texts = el => {
      const out = [];
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) {
        const s = n.nodeValue.replace(/\s+/g, ' ').trim();
        if (s) out.push(s);
      }
      return out;
    };
    const isRecess = td => td.classList.contains('print-tt__recess');

    function parseTimetable(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const areas = [...doc.querySelectorAll('div.printarea')];
      if (!areas.length) throw new Error('文件里找不到班级课表（没有 printarea）。请确认是从 eSchool「班级课表」列印页面另存的 HTML。');
      const sem = (html.match(/[?&]sem=(\d+)/) || [])[1];
      let periods, recess, times, pre, printed = '',
        note = '';
      const classes = areas.map((pa, idx) => {
        const infos = [...pa.querySelectorAll('.print-tt__info')].map(e => e.textContent.trim());
        const val = s => (s || '').split(/[：:]/).slice(1).join('：').trim();
        const tbl = pa.querySelector('.print-tt__timetable-box table');
        const rows = [...tbl.querySelectorAll('tr')];
        if (!periods) {
          const h0 = [...rows[0].children].slice(3);
          periods = [];
          recess = [];
          h0.forEach(td => {
            if (isRecess(td)) recess.push(periods.length);
            else periods.push(td.textContent.replace(/\s+/g, ''));
          });
          const h1 = [...rows[1].children];
          pre = h1.slice(1, 4).map(td => texts(td).join(''));
          times = h1.slice(4).filter(td => !isRecess(td)).map(td => texts(td));
          printed = infos[2] || '';
          const box = pa.querySelector('.print-tt__rmk-box');
          if (box) {
            const groups = [];
            let g = null;
            box.querySelectorAll('tr').forEach(tr => {
              const tds = [...tr.children];
              if (tds.length > 1) {
                g = {
                  who: tds[1].textContent.trim(),
                  lines: [tds[0].textContent.trim()]
                };
                groups.push(g);
              } else if (g && tds[0]) g.lines.push(tds[0].textContent.trim());
            });
            const clean = s => s.replace(/[A-Za-z]+\s*:\s*/g, '').replace(/~/g, '–').replace(/\s+/g, ' ');
            const title = (texts(box)[0] || '').replace(/\s*[A-Za-z0-9 ]*period\s*$/i, '');
            if (groups.length) note = `${title || '*'}：` + groups.map(x =>
              `${x.who} ${x.lines.map(clean).join('，')}`).join('；') + '。';
          }
        }
        const grid = rows.slice(2).map(tr => [...tr.children].slice(1)
            .filter(td => !isRecess(td) && !td.hasAttribute('rowspan'))
            .map(td => texts(td)))
          .filter(r => r.length);
        const p = [...pa.querySelectorAll('.print-tt__plan table')].map(t => [...t.querySelectorAll('tr')].filter(
          tr => tr.querySelector('td')).map(tr => [...tr.querySelectorAll('td')].map(td => td.textContent
        .trim())));
        return {
          n: val(infos[0]) || ('班级' + (idx + 1)),
          hr: val(infos[1]),
          g: grid,
          p
        };
      });
      return {
        periods,
        recess,
        times,
        pre,
        classes,
        printed,
        sem,
        note
      };
    }

    const SOURCES = ['source.html', '班级课表.html'];
    async function autoLoad() {
      let lastErr = null;
      if (location.protocol.startsWith('http')) {
        for (const src of SOURCES) {
          try {
            const r = await fetch(src + '?t=' + Date.now(), {
              cache: 'no-store'
            });
            if (!r.ok) {
              lastErr = new Error(`找不到「${decodeURIComponent(src)}」（${r.status}）`);
              continue;
            }
            return parseTimetable(decodeHtml(await r.arrayBuffer()));
          } catch (e) {
            lastErr = e;
          }
        }
      }
      throw lastErr || new Error('local');
    }

    function showPicker(err) {
      const msg = err && err.message !== 'local' ? `<p class="err">${String(err.message).replace(/</g, '&lt;')}</p>` :
        '';
      document.getElementById('out').innerHTML = `<div class="load">
    <h1>读取班级课表</h1>
    <p>请把「班级课表.html」放在「课表.exe」旁边后重新打开。也可以直接在这里选择文件。</p>
    ${msg}
    <label class="drop" id="drop"><input type="file" id="file" accept=".html,.htm"><b>选择或拖入「班级课表.html」</b><span>从 eSchool 列印页面「另存为」的 HTML 文件</span></label>
  </div>`;
      const drop = document.getElementById('drop');
      const take = f => f && f.arrayBuffer().then(b => {
        try {
          boot(parseTimetable(decodeHtml(b)));
        } catch (e) {
          showPicker(e);
        }
      });
      document.getElementById('file').onchange = e => take(e.target.files[0]);
      drop.ondragover = e => {
        e.preventDefault();
        drop.classList.add('over');
      };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => {
        e.preventDefault();
        drop.classList.remove('over');
        take(e.dataTransfer.files[0]);
      };
    }

    /* 告诉 课表.exe 页面还开着；全部关掉几分钟后程序会自动结束 */
    function heartbeat() {
      if (location.protocol.startsWith('http')) {
        const ping = () => fetch('/__ping', {
          cache: 'no-store'
        }).catch(() => {});
        ping();
        setInterval(ping, 20000);
      }
    }

    let booted = false;

    function boot(DATA) {
      booted = true;
      const DAYS = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const DAYS_EN = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const DSHORT = ['一', '二', '三', '四', '五', '六'];
      const WEEKDAYS = 5;
      const GROUP_RE = /^(E\d+|CO\w*\d+|Maker\d+|科实[A-Z])$/i;
      const ACT = new Set(['联课活动', '公共选修', '共同备课']);
      const esc = s => String(s).replace(/[&<>"]/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      } [c]));
      const zh = (a, b) => a.localeCompare(b, 'zh-Hans-CN');
      const $ = id => document.getElementById(id);

      /* 时间：08:00 am~ / 01:20 pm → 08:00–13:20 */
      const to24 = s => {
        const m = s.match(/(\d+):(\d+)\s*(am|pm)/i);
        if (!m) return s;
        let h = +m[1];
        if (/pm/i.test(m[3]) && h < 12) h += 12;
        return String(h).padStart(2, '0') + ':' + m[2];
      };
      const TIMES = DATA.times.map(([a, b]) => [to24(a), to24(b)]);
      const PER = DATA.periods.map(p => p.replace('*', ''));
      const gapAfter = i => DATA.recess.includes(i + 1) && i + 1 < PER.length;

      /* 科目 → 色系 */
      function kind(s) {
        if (ACT.has(s)) return 'act';
        if (/华文|书法/.test(s)) return 'cn';
        if (/英文/.test(s)) return 'en';
        if (/马来/.test(s)) return 'bm';
        if (/数/.test(s) || s === 'S高') return 'ma';
        if (/科|物|化|生/.test(s) && !/生涯/.test(s)) return 'sc';
        if (/历|地理/.test(s)) return 'hi';
        if (/会计|商业|经济/.test(s)) return 'bz';
        if (/电脑/.test(s)) return 'ict';
        if (/美术|音乐|设计/.test(s)) return 'art';
        if (/体育/.test(s)) return 'pe';
        if (/辅导|生涯|道/.test(s)) return 'gd';
        if (/专题/.test(s)) return 'prj';
        return 'oth';
      }
      const kcls = s => {
        const k = kind(s);
        return k === 'act' ? 'act' : 'k-' + k;
      };

      /* ---------- 由班级课表整合老师课表 ---------- */
      const classOrder = {};
      DATA.classes.forEach((c, i) => classOrder[c.n] = i);
      const C = {};
      DATA.classes.forEach(c => C[c.n] = c);
      const T = {};
      DATA.classes.forEach(c => c.g.forEach((row, d) => {
        if (d >= WEEKDAYS) return;
        row.forEach((cell, p) => {
          if (cell.length < 2) return;
          const [s, name] = cell;
          const t = T[name] || (T[name] = {
            name,
            slots: {},
            pair: {}
          });
          (t.slots[d + '-' + p] = t.slots[d + '-' + p] || []).push({
            s,
            c: c.n
          });
          const k = c.n + '\u0001' + s;
          t.pair[k] = (t.pair[k] || 0) + 1;
        });
      }));
      Object.values(T).forEach(t => {
        t.group = GROUP_RE.test(t.name);
        t.day = Array(WEEKDAYS).fill(0);
        Object.keys(t.slots).forEach(k => t.day[+k.split('-')[0]]++);
        t.total = t.day.reduce((a, b) => a + b, 0);
        const subjCount = {};
        Object.entries(t.pair).forEach(([k, n]) => {
          const s = k.split('\u0001')[1];
          subjCount[s] = (subjCount[s] || 0) + n;
        });
        t.subj = Object.keys(subjCount).sort((a, b) => subjCount[b] - subjCount[a]);
        t.cls = [...new Set(Object.keys(t.pair).map(k => k.split('\u0001')[0]))].sort((a, b) => classOrder[a] -
          classOrder[b]);
        t.homeroom = DATA.classes.filter(c => c.hr === t.name).map(c => c.n);
      });
      const teacherNames = Object.keys(T).sort((a, b) => (T[a].group - T[b].group) || zh(a, b));
      const MAXDAY = Math.max(...Object.values(T).flatMap(t => t.day));
      const MAXTOT = Math.max(...Object.values(T).map(t => t.total));
      const semester = (DATA.sem ? '第' + DATA.sem + '学期 · ' : '') + DATA.printed.replace('列印日期：', '资料更新 ');

      /* ---------- 共用组件 ---------- */
      const spark = arr =>
        `<span class="spark" aria-hidden="true">${arr.map(n => `<i style="height:${Math.max(2, n / MAXDAY * 18)}px"></i>`).join('')}</span>`;
      const chip = s => `<span class="chip ${kcls(s)}">${esc(s)}</span>`;

      function headRow(extra) {
        let h = `<tr><th class="day"></th>`;
        PER.forEach((p, i) => {
          h +=
            `<th><span class="p num">${esc(p)}${DATA.periods[i].includes('*') ? '*' : ''}</span><span class="num">${TIMES[i][0]}<br>${TIMES[i][1]}</span></th>`;
          if (gapAfter(i)) h += `<th class="gap"></th>`;
        });
        return h + (extra ? `<th class="cnt">节数</th>` : '') + `</tr>`;
      }
      const dayTh = d => `<th class="day"><b>${DAYS[d]}</b><span>${DAYS_EN[d]}</span></th>`;
      const sixthNote = DATA.note ? `<p class="note">${esc(DATA.note)}</p>` : '';

      /* 手机版按天列表：items(d,p) 返回 {s, w} 或 null */
      function dayList(nDays, items, counts) {
        let h = '<div class="days">';
        for (let d = 0; d < nDays; d++) {
          const rows = PER.map((p, i) => ({
            i,
            it: items(d, i)
          })).filter(x => x.it);
          h += `<div class="dayc"><h3>${DAYS[d]}<span>${counts ? counts[d] + ' 节' : ''}</span></h3>` +
            (rows.length ? `<ol>${rows.map(({ i, it }) => ` < li class = "${kcls(it.s)}" > < span class = "p num" > $ {
                esc(PER[i])
              } < /span><span class="t num">${TIMES[i][0]}–${TIMES[i][1]}</span > < span class = "w" > < b > $ {
                esc(it.s)
              } < /b>${it.w ? ' · ' + esc(it.w) : ''}</span > < /li>`).join('')}</ol > `
        : ` < div class = "none" > 没有课 < /div>`) + `</div > `;
  }
  return h + '</div>';
}
function weekBars(day, total, label, mx) {
  mx = Math.max(mx || MAXDAY, 1);
  return ` < div class = "week" > $ {
                day.map((n, d) =>
                  `<div class="d"><div class="bar"><i style="height:${n / mx * 100}%"></i></div><b class="num">${n}</b><span>${DSHORT[d]}</span></div>`
                  ).join('')
              } <
              div class = "total" > < b class = "num" > $ {
                total
              } < /b><span>${label}</span > < /div></div > `;
}
function navBar(list, cur, backLabel) {
  const i = list.indexOf(cur);
  return ` < div class = "dnav" >
              <
              button class = "btn"
              data - act = "back" > ←$ {
                backLabel
              } < /button><span class="sp"></span >
              <
              button class = "btn"
              data - act = "prev"
              $ {
                i <= 0 ? 'disabled' : ''
              }
              title = "键盘 ←" > ‹$ {
                i > 0 ? esc(list[i - 1]) : '上一个'
              } < /button> <
              button class = "btn"
              data - act = "next"
              $ {
                i >= list.length - 1 ? 'disabled' : ''
              }
              title = "键盘 →" > $ {
                i < list.length - 1 ? esc(list[i + 1]) : '下一个'
              }› < /button> <
              button class = "btn"
              data - act = "print" > 打印 < /button></div > `;
}

/* ---------- 老师：列表 ---------- */
function matchT(t, q) { return !q || t.name.toLowerCase().includes(q) || t.subj.some(s => s.toLowerCase().includes(q)) || t.cls.some(c => c.toLowerCase().includes(q)); }
function teacherList(q) {
  const list = teacherNames.filter(n => matchT(T[n], q));
  const cn = list.filter(n => !T[n].group && !/^[A-Za-z]/.test(n));
  const en = list.filter(n => !T[n].group && /^[A-Za-z]/.test(n));
  const gp = list.filter(n => T[n].group);
  const card = n => { const t = T[n]; return ` < button class = "tcard"
              data - go = "teacher=${esc(n)}" >
              <
              span class = "nm" > $ {
                esc(n)
              } < /span><span class="tot"><b class="num">${t.total}</b > $ {
                spark(t.day)
              } < small > 节 / 周 < /small></span >
              <
              span class = "sj" > $ {
                esc(t.subj.join('、'))
              } < /span></button > `; };
  const sec = (title, arr) => arr.length ? ` < section class = "section" > < h2 > $ {
                title
              } < span class = "count" > $ {
                arr.length
              } < /span></h2 > < div class = "tgrid" > $ {
                arr.map(card).join('')
              } < /div></section > ` : '';
  const people = cn.length + en.length;
  return ` < div class = "pagehead" > < div > < h1 > 老师 < /h1><p>${people} 位老师，节数为星期一至星期五合计。点击查看个人课表。</p > <
              /div></div >
              $ {
                list.length ? '' : `<div class="empty">找不到「${esc(q)}」</div>`
              }
              $ {
                sec('华文名 · 按拼音', cn)
              }
              $ {
                sec('英文 / 马来文名', en)
              }
              $ {
                sec('分组 / 代号', gp)
              }
              `;
}

/* ---------- 老师：课表 ---------- */
function teacherDetail(name) {
  const t = T[name];
  let body = '';
  for (let d = 0; d < WEEKDAYS; d++) {
    body += ` < tr > $ {
                dayTh(d)
              }
              `;
    PER.forEach((_, p) => {
      const it = t.slots[d + '-' + p];
      if (it) {
        const s = it[0].s;
        body += ` < td class = "on ${kcls(s)}" > < span class = "s" > $ {
                esc(s)
              } < /span><span class="w">${it.map(x => esc(x.c)).join('、')}</span > < /td>`;
            }
          else body += `<td class="slot"></td>`;
          if (gapAfter(p)) body += `<td class="gap"></td>`;
        });
      body += `<td class="count num">${t.day[d]}</td></tr>`;
    }
    const plan = Object.entries(t.pair).map(([k, n]) => {
        const [c, s] = k.split('\u0001');
        return {
          c,
          s,
          n
        };
      })
      .sort((a, b) => classOrder[a.c] - classOrder[b.c] || zh(a.s, b.s));
    return `<div class="detail">${navBar(teacherNames, name, '全部老师')}
    <div class="dhead">
      <div><div class="kind">${t.group ? '分组 / 代号' : '老师'}</div><h1>${esc(name)}</h1>
        <div class="chips">${t.subj.map(chip).join('')}</div></div>
      ${weekBars(t.day, t.total, '节 / 周')}
      <div class="meta"><span>任教 <b>${t.cls.length}</b> 班</span>${t.homeroom.length ? `<span>班导师：<b>${t.homeroom.map(esc).join('、')}</b></span>` : ''}<span>最多一天 <b>${Math.max(...t.day)}</b> 节</span></div>
    </div>
    <div class="ttwrap"><table class="tt"><thead>${headRow(true)}</thead><tbody>${body}</tbody></table>${sixthNote}</div>
    ${dayList(WEEKDAYS, (d, p) => { const it = t.slots[d + '-' + p]; return it ? { s: it[0].s, w: it.map(x => x.c).join('、') } : null; }, t.day)}
    <div class="plan">${plan.map(r => `<div class="prow"><span class="chip ${kcls(r.s)}">${esc(r.s)}</span><span class="who"><button class="lnk" data-go="class=${esc(r.c)}">${esc(r.c)}</button></span><b class="num">${r.n}<small>节</small></b></div>`).join('')}</div>
  </div>`;
    }

    /* ---------- 班级：列表 ---------- */
    function classList(q) {
      const by = {};
      DATA.classes.filter(c => !q || c.n.toLowerCase().includes(q) || c.hr.toLowerCase().includes(q))
        .forEach(c => (by[c.n.slice(0, 2)] = by[c.n.slice(0, 2)] || []).push(c));
      const gs = Object.keys(by);
      return `<div class="pagehead"><div><h1>班级</h1><p>${DATA.classes.length} 个班，按年级排列。</p></div></div>
    ${gs.length ? '' : `<div class="empty">找不到「${esc(q)}」</div>`}
    ${gs.map(g => `<section class="section"><h2>${g}<span class="count">${by[g].length} 班</span></h2><div class="cgrid">
      ${by[g].map(c => `<button class="ccard" data-go="class=${esc(c.n)}"><b>${esc(c.n.slice(2))}</b><span>班导师 ${esc(c.hr)}</span></button>`).join('')}</div></section>`).join('')}`;
    }

    /* ---------- 班级：课表 ---------- */
    function classDetail(n) {
      const c = C[n];
      const cnt = c.g.map(row => row.filter(x => x.length).length);
      let body = '';
      c.g.forEach((row, d) => {
        body += `<tr class="${d >= WEEKDAYS ? 'sat' : ''}">${dayTh(d)}`;
        row.forEach((cell, p) => {
          if (!cell.length) body += `<td class="slot"></td>`;
          else {
            const k = kcls(cell[0]);
            const w = cell[1] ? (T[cell[1]] ?
                `<button class="lnk" data-go="teacher=${esc(cell[1])}">${esc(cell[1])}</button>` : esc(cell[1])
                ) : '';
            body +=
            `<td class="on ${k}"><span class="s">${esc(cell[0])}</span><span class="w">${w}</span></td>`;
          }
          if (gapAfter(p)) body += `<td class="gap"></td>`;
        });
        body += `</tr>`;
      });
      // 合并原版的「班级/教师 · 节数 · 科目」
      const plan = c.p.flat();
      const subjects = [...new Set(plan.map(r => r[2]))];
      const weekTotal = cnt.slice(0, WEEKDAYS).reduce((a, b) => a + b, 0);
      return `<div class="detail">${navBar(DATA.classes.map(x => x.n), n, '全部班级')}
    <div class="dhead">
      <div><div class="kind">${esc(n.slice(0, 2))} · 班级</div><h1>${esc(n)}</h1>
        <div class="chips">${subjects.slice(0, 16).map(chip).join('')}</div></div>
      ${weekBars(cnt.slice(0, WEEKDAYS), weekTotal, '节 / 周', PER.length)}
      <div class="meta"><span>班导师：${T[c.hr] ? `<button class="lnk" data-go="teacher=${esc(c.hr)}"><b>${esc(c.hr)}</b></button>` : `<b>${esc(c.hr)}</b>`}</span><span>科任老师 <b>${new Set(plan.map(r => r[0])).size}</b> 位</span></div>
    </div>
    <div class="ttwrap"><table class="tt"><thead>${headRow(false)}</thead><tbody>${body}</tbody></table>${sixthNote}</div>
    ${dayList(c.g.length, (d, p) => { const x = c.g[d][p]; return x.length ? { s: x[0], w: x[1] || '' } : null; }, cnt)}
    <div class="plan">${plan.map(r => `<div class="prow"><span class="chip ${kcls(r[2])}">${esc(r[2])}</span>
      <span class="who">${T[r[0]] ? `<button class="lnk" data-go="teacher=${esc(r[0])}">${esc(r[0])}</button>` : esc(r[0])}</span><b class="num">${esc(r[1])}<small>节</small></b></div>`).join('')}</div>
  </div>`;
    }

    /* ---------- 节数总表 ---------- */
    let sortKey = 'total',
      sortDir = -1;

    function summary(q) {
      const list = teacherNames.map(n => T[n]).filter(t => matchT(t, q));
      const val = (t, k) => k === 'name' ? t.name : k === 'total' ? t.total : k === 'subj' ? (t.subj[0] || '') : t.day[+
        k];
      const cmp = (a, b) => {
        const x = val(a, sortKey),
          y = val(b, sortKey);
        const r = typeof x === 'number' ? x - y : zh(x, y);
        return r * sortDir || zh(a.name, b.name);
      };
      const cols = [
        ['name', '老师', ''],
        ['0', '一', 'c'],
        ['1', '二', 'c'],
        ['2', '三', 'c'],
        ['3', '四', 'c'],
        ['4', '五', 'c'],
        ['total', '总节数', ''],
        ['subj', '科目', ''],
        ['cls', '班级', '']
      ];
      const th = cols.map(([k, l, c]) =>
        `<th class="${c}" data-k="${k}" ${k === sortKey ? `aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`
        ).join('');
      const row = t => `<tr><td><button class="lnk" data-go="teacher=${esc(t.name)}">${esc(t.name)}</button></td>
    ${t.day.map(n => `<td class="h c num"><span class="${n >= 7 ? 'hi' : ''}" style="--v:${n}">${n}</span></td>`).join('')}
    <td class="tot"><span class="tbar"><b class="num">${t.total}</b><i style="width:${t.total / MAXTOT * 110}px"></i></span></td>
    <td class="sj">${t.subj.map(chip).join(' ')}</td><td class="cl">${esc(t.cls.join('、'))}</td></tr>`;
      const people = list.filter(t => !t.group).sort(cmp),
        groups = list.filter(t => t.group).sort(cmp);
      const all = teacherNames.map(n => T[n]).filter(t => !t.group);
      const avg = (all.reduce((a, t) => a + t.total, 0) / all.length).toFixed(1);
      return `<div class="pagehead"><div><h1>老师节数总表</h1><p>星期一至星期五，每个时段算 1 节。不含早自习、班导师时间、晨读、联课活动、公共选修与共同备课。</p></div>
      <div class="stats"><div class="stat"><b class="num">${all.length}</b><span>位老师</span></div><div class="stat"><b class="num">${avg}</b><span>平均节数</span></div><div class="stat"><b class="num">${Math.max(...all.map(t => t.total))}</b><span>最多节数</span></div>
      <button class="btn noprint" data-act="print" style="align-self:center">打印</button></div></div>
    <div class="sumwrap"><table class="sum"><thead><tr>${th}</tr></thead><tbody>
      ${people.map(row).join('')}
      ${groups.length ? `<tr class="grp"><td colspan="9">分组 / 代号（E1–E12、COMM、Maker、科实等，课表中以代号代替老师名字）</td></tr>${groups.map(row).join('')}` : ''}
      ${list.length ? '' : `<tr><td colspan="9" class="empty">找不到「${esc(q)}」</td></tr>`}
    </tbody></table></div>`;
    }

    /* ---------- 路由 ---------- */
    const out = $('out'),
      searchEl = $('search');
    let mode = 'teacher',
      cur = null;

    function parse() {
      const h = decodeURIComponent(location.hash.slice(1));
      const m = h.match(/^(teacher|class|summary)(?:=(.+))?$/);
      mode = m ? m[1] : 'teacher';
      cur = m && m[2] ? m[2] : null;
      if (cur && !(mode === 'teacher' ? T[cur] : C[cur])) cur = null;
    }

    function go(h) {
      location.hash = h;
    }

    function render() {
      parse();
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
      $('searchWrap').hidden = !!cur;
      const q = searchEl.value.trim().toLowerCase();
      if (mode === 'summary') out.innerHTML = summary(q);
      else if (mode === 'teacher') out.innerHTML = cur ? teacherDetail(cur) : teacherList(q);
      else out.innerHTML = cur ? classDetail(cur) : classList(q);
      document.title = (cur ? cur + ' · ' : '') + '循人课表';
    }

    function step(d) {
      const L = mode === 'teacher' ? teacherNames : DATA.classes.map(c => c.n);
      const i = L.indexOf(cur);
      if (i >= 0 && L[i + d]) go(mode + '=' + L[i + d]);
    }
    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) {
        if (b.dataset.mode === mode && !cur) return;
        go(b.dataset.mode);
      }
    });
    searchEl.addEventListener('input', () => {
      if (!cur) render();
    });
    out.addEventListener('click', e => {
      const g = e.target.closest('[data-go]');
      if (g) {
        go(g.dataset.go);
        return;
      }
      const a = e.target.closest('[data-act]');
      if (a) {
        const act = a.dataset.act;
        if (act === 'back') go(mode);
        else if (act === 'prev') step(-1);
        else if (act === 'next') step(1);
        else if (act === 'print') window.print();
        return;
      }
      const th = e.target.closest('th[data-k]');
      if (th && th.dataset.k !== 'cls') {
        const k = th.dataset.k;
        sortDir = sortKey === k ? -sortDir : (k === 'name' || k === 'subj' ? 1 : -1);
        sortKey = k;
        render();
      }
    });
    document.addEventListener('keydown', e => {
      if (!cur || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'Escape') go(mode);
    });
    window.addEventListener('hashchange', () => {
      render();
      window.scrollTo(0, 0);
    });
    $('sub').textContent = semester;
    render();
    }

    document.getElementById('out').innerHTML =
    '<div class="load"><div class="spin"></div><p>正在读取「班级课表.html」…</p></div>';
    autoLoad().then(boot).catch(showPicker);
    heartbeat();
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('gh').href = GITHUB_URL;
  </script>
</body>

</html>
