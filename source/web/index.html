<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="循人中学教师与班级课表：由 eSchool 班级课表自动整合老师课表与每周节数。" />
    <title>循人课表</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <div class="brand"><b id="brandTitle">循人中学 · 课表</b><span id="sub"></span></div>
        <nav class="seg" id="tabs" aria-label="视图">
          <button type="button" data-mode="teacher">老师</button>
          <button type="button" data-mode="class">班级</button>
          <button type="button" data-mode="summary">节数总表</button>
        </nav>
        <label class="search" id="searchWrap">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="search" type="search" placeholder="搜索老师、科目或班级" aria-label="搜索" />
        </label>
      </div>
    </header>

    <main id="out"></main>

    <footer class="foot">
      <div class="foot-in">
        <span
          >© <span id="year">2026</span> <b id="schoolName">循人中学</b>
          <span id="schoolNameEn">Tsun Jin High School</span> · 版权所有</span
        >
        <a id="gh" href="#" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
          GitHub 项目
        </a>
      </div>
    </footer>

    <!-- 载入顺序：设置 → 工具 → 解析 → 界面 → 启动 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
