; 循人课表 · 程序设置
; 修改后重新打开 Teacher-TimeTable.exe 即生效（会自动关闭旧的窗口）。
; 注解用 ; 或 #，可以写在行尾。

[server]
; true  = 同一网络的同事可以用 http://你的IP:端口/ 打开课表；程序一直运行，关闭窗口才结束。
;         第一次运行时 Windows 防火墙会询问，请按「允许访问」。
; false = 只有这台电脑能打开；浏览器页面全部关闭约 3 分钟后程序自动结束。
lan = true

; 网页服务的端口（1024–65535）
port = 17380

; 启动时自动打开浏览器（true / false）
open_browser = true

[log]
; 日志在 logs/ 文件夹，每天一个文件；超过这个天数的旧日志会自动删除
keep_days = 30

; 记录详细程度：debug / info / warn
level = info
